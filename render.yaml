# =============================================================================
# Render Blueprint — Consumer Attention Mapping System (CAMS)
# =============================================================================
# Infrastructure-as-Code definition for Render.com deployment.
# Deploy with: Connect your GitHub repo at https://dashboard.render.com
# =============================================================================

services:
  - type: web
    name: cams-backend
    runtime: docker
    repo: https://github.com/indranidan/IndraniDan-Consumer-Attention-Mapping-System
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # ── Database (PostgreSQL on Supabase) ────────────────────
      - key: DATABASE_URL
        sync: false
      # ── Database (MongoDB Atlas) ─────────────────────────────
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: consumer_attention_ai_db
      # ── Redis (Upstash) ─────────────────────────────────────
      - key: REDIS_URL
        sync: false
      # ── JWT Security ────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      # ── Google OAuth ────────────────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # ── Application URLs ────────────────────────────────────
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      # ── AI / Storage Paths ──────────────────────────────────
      - key: AI_OUTPUT_PATH
        value: storage/outputs/ai_jobs
      - key: AI_INPUT_PATH
        value: storage/uploads
      - key: REPORTS_OUTPUT_PATH
        value: storage/outputs/reports
      - key: AI_PIPELINE_TIMEOUT
        value: 3600
      - key: AI_MAX_CONCURRENT_JOBS
        value: 1
