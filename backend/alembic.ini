# Alembic Configuration
# =====================
# This file is used by Alembic for database migration management.

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration file names
file_template = %%(rev)s_%%(slug)s

# Use 'true' to run the environment without connecting to a database
# (for generating SQL scripts offline)
prepend_sys_path = .

# Database URL — overridden at runtime by env.py from app settings
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/consumer_attention_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
